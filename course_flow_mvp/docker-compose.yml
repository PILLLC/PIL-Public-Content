version: '3.9'

services:
  web:
    build: .
    container_name: pil_course_flow
    volumes:
      - .:/app
       - ./exports:/app/exports
    ports:
      - "8080:8000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5